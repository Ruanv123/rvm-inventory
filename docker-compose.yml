services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: postgres-inventory
    ports:
      - '6500:5432'
    volumes:
      - progresDB:/data/postgres
    environment:
      - POSTGRES_USER=seu_usuario
      - POSTGRES_PASSWORD=sua_senha
      - POSTGRES_DB=seu_banco_de_dados

volumes:
  progresDB:
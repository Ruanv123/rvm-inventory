services:
  postgres:
    image: bitnami/postgresql:latest
    container_name: postgres-inventory
    ports:
      - '6500:5432'
    volumes:
      - progresDB:/data/postgres
    environment:
      - POSTGRES_USER=rvmuser
      - POSTGRES_PASSWORD=rvmpassword
      - POSTGRES_DB=inventory

volumes:
  progresDB: